name: CD Pipeline - Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

env:
  AWS_REGION: us-east-1
  DEPLOY_ENV: ${{ inputs.environment || 'dev' }}

jobs:
  deploy:
    name: Deploy Serverless Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build Lambda Layer Dependencies
        run: |
          mkdir -p layer/python infra/modules/lambda/dist
          pip install pydantic pydantic-core annotated-types typing-extensions -t layer/python
          cd layer && zip -r ../infra/modules/lambda/dist/layer.zip python && cd ..

      - name: Initialize Terraform with Remote Backend
        run: |
          cd infra
          terraform init -backend-config=environments/${{ env.DEPLOY_ENV }}/backend.tfvars

      - name: Terraform Plan
        run: |
          cd infra
          terraform plan -var-file=environments/${{ env.DEPLOY_ENV }}/terraform.tfvars -out=tfplan

      - name: Terraform Apply
        run: |
          cd infra
          terraform apply -auto-approve tfplan
